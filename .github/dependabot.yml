version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Australia/Sydney'

    open-pull-requests-limit: 10

    reviewers:
      - 'luisdlpr'

    assignees:
      - 'luisdlpr'

    labels:
      - 'dependencies'

    commit-message:
      prefix: 'chore'

    groups:
      production:
        dependency-type: 'production'

      development:
        dependency-type: 'development'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:30'
      timezone: 'Australia/Sydney'

    labels:
      - 'dependencies'
      - 'github-actions'

    commit-message:
      prefix: 'ci'

    groups:
      actions:
        patterns:
          - '*'
